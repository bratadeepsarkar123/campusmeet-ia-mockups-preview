<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Option A — Admin Approvals</title><style>body{font:15px system-ui;background:#0b0d12;color:#e8ecf4;margin:auto;padding:16px;max-width:520px}.card{background:#161a24;border:1px solid #2a3142;border-radius:14px;padding:16px;margin:10px 0}button{padding:10px;border:0;border-radius:10px;background:#7c6cff;color:white}small{color:#9aa3b5}</style><h1>Approvals</h1><p><small>Option A · priority list</small></p><div id="app"></div><script>const e=[['HackNight Fall','Demo Robotics','pending'],['Open Mic Soft Launch','LitSoc','pending'],['Freshers Orientation','Student Council','pending']];function r(){app.innerHTML=e.map((x,i)=>`<section class=card><b>${x[0]}</b><br><small>${x[1]} · ${x[2]}</small><p><button onclick="e[${i}][2]='approved';r()">Approve</button> <button onclick="e[${i}][2]='rejected';r()">Reject</button></p></section>`).join('')}r()</script>
