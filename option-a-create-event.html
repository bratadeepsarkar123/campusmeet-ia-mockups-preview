<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Option A — Create Event</title><style>body{font:15px system-ui;background:#0b0d12;color:#e8ecf4;margin:auto;padding:16px;max-width:520px}.card{background:#161a24;border:1px solid #2a3142;border-radius:14px;padding:16px;margin:10px 0}input,textarea,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #2a3142;background:#12151c;color:#e8ecf4}button{background:#7c6cff;border:0}</style><h1>Create event</h1><p>Option A · progressive disclosure</p><div id="app"></div><script>const s=['Essentials','When & where','Look & POC','Tickets','Questions','Review'];let i=0;function r(){app.innerHTML=`<div class=card><h2>${s[i]}</h2><input placeholder="Event title"><textarea placeholder="Details"></textarea><button onclick="i=Math.min(i+1,5);r()">${i===5?'Submit for approval':'Next'}</button></div><p>Step ${i+1} of 6</p>`}r()</script>
